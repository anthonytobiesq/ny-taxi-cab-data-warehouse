[project]
name = "ny_taxi_data-warehouse"
version = "0.1.0"
description = "A data warehouse for New York City taxi data, built with DLT and DuckDB."
requires-python = ">=3.13"
dependencies = [
    "dlt[duckdb]>=1.0.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.1.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
]

[project.scripts]
data-warehouse = "data_warehouse:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

